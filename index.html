<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4d96ff">
<title>English Kids 🦁</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#26325b;--mut:#6b7699;--card:#fff;--line:#d9e4f5;--pri:#4d96ff;--ok:#2fbf71;--bad:#ff5d6c;--gold:#ffb100;--c:#4d96ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Fredoka','Trebuchet MS',system-ui,'Segoe UI',Tahoma,Arial,sans-serif;color:var(--ink);background:linear-gradient(180deg,#d6efff,#fff6df 75%) fixed;min-height:100vh;padding-bottom:104px}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select{font-family:inherit;font-size:18px;padding:12px;border-radius:14px;border:3px solid var(--line);color:var(--ink);background:#fff}
#hdr{max-width:760px;margin:0 auto;padding:12px 14px 2px}
.hrow{display:flex;align-items:center;gap:10px}
.av{width:54px;height:54px;border-radius:50%;border:3px solid #fff;background:#fff;font-size:30px;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.pill{background:#fff;border-radius:99px;padding:6px 12px;font-weight:600;box-shadow:0 3px 0 rgba(0,0,0,.08);white-space:nowrap}
.mut{color:var(--mut);font-size:14px}
.goal{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:14px;font-weight:600}
.bar{flex:1;height:12px;background:#fff;border-radius:99px;overflow:hidden;box-shadow:inset 0 0 0 2px var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ff8a3d);border-radius:99px;transition:width .5s}
.bar.sm{height:9px;margin-top:6px}
#app{max-width:760px;margin:0 auto;padding:4px 14px}
.card{background:var(--card);border-radius:24px;padding:18px;margin:12px 0;box-shadow:0 5px 0 rgba(38,50,91,.08),0 12px 26px rgba(38,50,91,.08)}
.center{text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;margin-top:12px}
.btn{background:var(--c,var(--pri));color:#fff;border:0;border-radius:18px;padding:13px 22px;font-size:19px;font-weight:600;box-shadow:0 5px 0 rgba(0,0,0,.2);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn.alt{background:#fff;color:var(--pri);border:3px solid var(--pri);box-shadow:0 4px 0 var(--line)}
.btn.sm{padding:8px 14px;font-size:15px;border-radius:14px}
.btn.mic{background:var(--bad)}
.btn.rec{background:#c9243a;animation:pulse 1s infinite}
.btn:disabled{opacity:.5}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(255,93,108,.25)}}
.emo{font-size:104px;line-height:1.15;cursor:pointer;user-select:none}
.word{font-size:40px;font-weight:700;margin:6px 0}
.sent{font-size:27px;font-weight:600;line-height:1.45;margin:8px 0}
.ar{direction:rtl;font-size:20px;color:var(--mut);margin:4px 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.opt{border:3px solid var(--line);background:#fff;border-radius:20px;padding:16px 8px;font-size:22px;font-weight:600;box-shadow:0 5px 0 var(--line);min-height:64px}
.opt.emoopt{font-size:62px;padding:8px}
.opt.letopt{font-size:46px}
.opt:active{transform:translateY(3px)}
.opt.right{border-color:var(--ok);background:#e3f9ec;box-shadow:0 5px 0 var(--ok)}
.opt.wrong{border-color:var(--bad);background:#ffe9ec;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.lv{display:flex;gap:14px;align-items:center;width:100%;text-align:left;border:0;border-left:12px solid var(--c);background:#fff;border-radius:22px;padding:14px 16px;margin:12px 0;box-shadow:0 5px 0 rgba(38,50,91,.08),0 12px 26px rgba(38,50,91,.08)}
.lvE{font-size:46px}
.tagr{background:var(--gold);color:#fff;border-radius:99px;font-size:12px;padding:2px 9px;vertical-align:middle}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.act{background:#fff;border:3px solid var(--line);border-radius:20px;padding:14px 8px;text-align:center;font-size:17px;font-weight:600;box-shadow:0 5px 0 var(--line)}
.act.done{border-color:var(--ok);background:#effbf4}
.act b{display:block;font-size:40px}
.act .st{font-size:15px;margin-top:2px}
.bar2{display:flex;align-items:center;gap:12px;margin-top:10px}
.bar2 b{font-size:20px}
.stars{font-size:54px;letter-spacing:6px;margin:6px 0}
.box{min-height:56px;background:#f5f9ff;border:3px dashed var(--line);border-radius:16px;padding:10px;margin-top:12px;font-size:20px;line-height:1.6}
.ok{color:var(--ok);font-weight:700}.no{color:var(--bad);font-weight:700;text-decoration:underline}
.tile{border:3px solid var(--line);background:#fff;border-radius:14px;padding:10px 14px;font-size:21px;font-weight:600;margin:4px;box-shadow:0 4px 0 var(--line)}
.slotsA{min-height:68px;border:3px dashed var(--line);border-radius:16px;padding:6px;margin-top:12px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center}
.sent2{display:flex;gap:8px;align-items:center;padding:10px;border-radius:16px;margin:6px 0;font-size:22px;line-height:1.55;text-align:left}
.sent2.cur{background:#fff4cc}.sent2.good{background:#e3f9ec}.sent2.bad{background:#ffe9ec}
.sent2>span{flex:1}
.sp{border:0;background:#e6f0ff;border-radius:50%;width:42px;height:42px;font-size:20px;flex:none}
.wd{border-radius:8px;padding:0 3px;cursor:pointer}
.wd.on{background:var(--gold);color:#fff}
.abc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lt{border:3px solid var(--line);background:#fff;border-radius:16px;padding:8px 2px;box-shadow:0 4px 0 var(--line);font-size:14px}
.lt b{display:block;font-size:26px}
.lt.seen{border-color:var(--ok);background:#effbf4}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.mc{height:92px;border-radius:18px;border:3px solid var(--line);background:var(--pri);color:#fff;font-size:34px;font-weight:700;box-shadow:0 4px 0 rgba(0,0,0,.15);padding:2px}
.mc.up{background:#fff;color:var(--ink)}
.mc.m{background:#e3f9ec;border-color:var(--ok);color:var(--ink)}
.mc.sw{font-size:18px}
#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:4px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:#fff;border-top:3px solid var(--line);z-index:20}
#tabs button{flex:1;max-width:130px;border:0;background:transparent;border-radius:16px;padding:6px 2px;font-size:12px;font-weight:600;color:var(--mut)}
#tabs button b{display:block;font-size:26px}
#tabs button.on{background:#e6f0ff;color:var(--pri)}
.hide{display:none!important}
.ov{position:fixed;inset:0;background:rgba(214,239,255,.96);z-index:40;overflow:auto;padding:20px 14px}
.ov .card{max-width:480px;margin:20px auto}
.avs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.avs button{font-size:38px;border:3px solid var(--line);background:#fff;border-radius:18px;padding:6px}
.avs button.on{border-color:var(--pri);background:#e6f0ff}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%) translateY(-80px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-weight:600;z-index:60;transition:.3s}
.toast.show{transform:translateX(-50%)}
.cf{position:fixed;top:-30px;font-size:28px;animation:fall 2.4s linear forwards;z-index:50;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.stat div{background:#f5f9ff;border-radius:16px;padding:10px;text-align:center;font-weight:600}
.chart{display:flex;gap:8px;align-items:flex-end;height:110px;margin-top:10px}
.chart div{flex:1;text-align:center;font-size:12px;color:var(--mut)}
.chart i{display:block;background:var(--pri);border-radius:8px 8px 0 0;min-height:3px}
.warn{background:#fff3cd;color:#6b5200;border-radius:14px;padding:10px 14px;font-size:14px;margin:10px 0}
@media(max-width:420px){.emo{font-size:88px}.word{font-size:34px}.abc{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div id="hdr"></div>
<div id="app"></div>
<nav id="tabs">
  <button data-t="learn" class="on"><b>🏠</b>Learn</button>
  <button data-t="abc"><b>🔤</b>ABC</button>
  <button data-t="games"><b>🎮</b>Games</button>
  <button data-t="talk"><b>🎤</b>Talk</button>
  <button data-t="me"><b>👤</b>Me</button>
</nav>
<div id="ov" class="ov hide"></div>
<div class="toast" id="toast"></div>

function listen(o){
  const r=new SR();r.lang='en-US';r.interimResults=true;r.continuous=!!o.cont;r.maxAlternatives=3;
  let fin='',alts=[],ended=false,tm;
  const finish=()=>{if(ended)return;ended=true;clearTimeout(tm);o.done(fin.trim(),alts)};
  r.onresult=e=>{let it='';for(let i=e.resultIndex;i<e.results.length;i++){const res=e.results[i];if(res.isFinal){fin+=res[0].transcript+' ';for(let k=0;k<res.length;k++)alts.push(res[k].transcript)}else it+=res[0].transcript}if(o.interim)o.interim(fin,it)};
  r.onend=finish;
  r.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed')toast('🎤 اسمحوا للمتصفح يستخدم الميكروفون')};
  tm=setTimeout(()=>{try{r.stop()}catch(e){}},o.max||7000);
  try{r.start()}catch(e){finish()}
  return{stop:()=>{try{r.stop()}catch(e){}},abort:()=>{ended=true;clearTimeout(tm);try{r.abort()}catch(e){}}}
}
function stopAll(){tok++;try{speechSynthesis.cancel()}catch(e){}if(curRec){try{curRec.abort()}catch(e){}curRec=null}}
const NUM=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'];
const norm=s=>String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/\b(\d+)\b/g,(m,n)=>NUM[+n]||m).replace(/[^a-z' ]/g,' ').split(/\s+/).filter(Boolean);
function lev(a,b){const m=a.length,n=b.length,d=[];for(let i=0;i<=m;i++){d[i]=[i];for(let j=1;j<=n;j++)d[i][j]=i?0:j}for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function match(target,said){const T=norm(target),W=norm(said),used=W.map(()=>false);let hit=0;
  const marks=T.map(t=>{const j=W.findIndex((w,i)=>!used[i]&&(w===t||(t.length>3&&lev(w,t)<=1)));if(j>=0){used[j]=true;hit++;return[t,1]}return[t,0]});
  return{pct:T.length?Math.round(hit/T.length*100):0,marks}}
function bestMatch(target,said,alts){let b=match(target,said);(alts||[]).forEach(a=>{const m=match(target,a);if(m.pct>b.pct)b=m});return b}
const marksHtml=m=>m.marks.map(x=>`<span class="${x[1]?'ok':'no'}">${esc(x[0])}</span>`).join(' ');

function finish(key,ratio,o){

  beep(true);if(s===3)confetti();setTimeout(()=>say(s===3?'Amazing!':s===2?'Great job!':'Good try!'),250);

/* generic multiple-choice runner */
function runMC(qs,o){
  let i=0,score=0;const my=++tok;
  const draw=()=>{
    if(i>=qs.length)return finish(o.key,score/qs.length,{again:o.again,back:o.back});
    const q=qs[i];
    $('app').innerHTML=backBar(o.back,o.title)+`<div class="card center"><div class="mut">${i+1}/${qs.length}</div>${q.head}<div class="opts">${q.o.map((x,k)=>`<button class="opt ${q.ocls||''}" data-k="${k}">${x}</button>`).join('')}</div></div>`;
    if(q.say)setTimeout(()=>{if(tok===my)say(q.say)},250);
    const sb=$('qSay');if(sb)sb.onclick=()=>say(q.say);
    document.querySelectorAll('#app .opt').forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k,ok=k===q.a;
      document.querySelectorAll('#app .opt').forEach(x=>{x.disabled=true;if(+x.dataset.k===q.a)x.classList.add('right')});
      if(ok)score++;else b.classList.add('wrong');beep(ok);if(q.after)say(q.after);
      setTimeout(()=>{if(tok===my){i++;draw()}},ok?1000:1700);
    });
  };draw();
}

/* ---- 1. Learn words ---- */
function actLearn(){
  const u=curU();let i=0;
  const draw=()=>{const w=u.w[i];
    $('app').innerHTML=backBar('showUnit()',u.t+' · Learn')+`<div class="card center"><div class="mut">${i+1}/${u.w.length}</div><div class="emo" id="lnE">${w[2]}</div><div class="word">${esc(w[0])}</div>${R.set.ar?`<div class="ar">${w[1]}</div>`:''}<div class="row"><button class="btn alt" id="lnSay">🔊 Listen</button></div><div class="row">${i>0?'<button class="btn alt" id="lnPrev">⬅</button>':''}<button class="btn" id="lnNext">${i<u.w.length-1?'Next ➡':'Finish ✅'}</button></div><div class="mut" style="margin-top:12px">Say it out loud! 🗣️</div></div>`;

    $('lnNext').onclick=()=>{if(i<u.w.length-1){i++;draw()}else finish(ukey('learn'),1,{again:'actLearn()',back:'showUnit()'})};

/* ---- 2. Listen & pick ---- */
function actPick(){

  const qs=shuffle(u.w).slice(0,n).map(w=>{
    const o=shuffle([w,...shuffle(u.w.filter(x=>x!==w)).slice(0,3)]),m=pick(modes),a=o.indexOf(w);
    if(m==='pic')return{head:`<div class="mut">👂 Listen and tap the picture</div><div class="row"><button class="btn alt" id="qSay" style="font-size:34px">🔊</button></div>`,o:o.map(x=>x[2]),ocls:'emoopt',a,say:w[0]};
    if(m==='word')return{head:`<div class="mut">👀 What is this?</div><div class="emo">${w[2]}</div>`,o:o.map(x=>esc(x[0])),a,after:w[0]};
    return{head:`<div class="mut">🤔 What does it mean?</div><div class="word">${esc(w[0])}</div><div class="row"><button class="btn alt sm" id="qSay">🔊</button></div>`,o:o.map(x=>x[1]),a,say:w[0]};

/* ---- 3. Say it ---- */
function actSay(){
  const u=curU();
  const items=[...shuffle(u.w).slice(0,3).map(w=>({t:w[0],e:w[2],a:w[1],k:'w'})),...u.s.map(s=>({t:s[0],a:s[1],k:'s'}))];
  let i=0,pts=0,tries=0;const my=++tok;
  const draw=()=>{
    if(i>=items.length)return finish(ukey('say'),pts/items.length,{again:'actSay()',back:'showUnit()'});
    const it=items[i];tries=0;
    $('app').innerHTML=backBar('showUnit()',u.t+' · Say It')+`<div class="card center"><div class="mut">${i+1}/${items.length} · Listen, then say it!</div>${it.e?`<div class="emo">${it.e}</div>`:''}<div class="${it.k==='w'?'word':'sent'}">${esc(it.t)}</div>${R.set.ar?`<div class="ar">${it.a}</div>`:''}
     <div class="row"><button class="btn alt" id="syHear">🔊 Listen</button>${SR?'<button class="btn mic" id="syMic">🎤 Say it</button>':'<button class="btn" id="syDone">✅ I said it</button>'}</div><div id="syRes" class="box">${SR?'Tap 🎤 and speak':'Say it out loud, then tap ✅'}</div><div class="row"><button class="btn alt sm" id="sySkip">Skip ➡</button></div></div>`;
    setTimeout(()=>{if(tok===my)say(it.t)},200);
    const next=d=>setTimeout(()=>{if(tok===my){i++;draw()}},d);
    $('syHear').onclick=()=>say(it.t);
    $('sySkip').onclick=()=>{if(curRec){curRec.abort();curRec=null}next(50)};
    if($('syDone'))$('syDone').onclick=()=>{pts+=.7;beep(true);next(300)};
    if($('syMic'))$('syMic').onclick=()=>{
      if(curRec){curRec.stop();return}
      speechSynthesis.cancel();const mb=$('syMic');mb.textContent='⏹ Stop';mb.classList.add('rec');$('syRes').textContent='🎧 Listening…';
      curRec=listen({max:6500,done:(f,alts)=>{
        curRec=null;if(tok!==my)return;const b=$('syMic');if(b){b.textContent='🎤 Say it';b.classList.remove('rec')}
        if(!f){tries++;$('syRes').textContent="I didn't hear you. Try again! 🎤";return}
        const m=bestMatch(it.t,f,alts);
        if(m.pct>=60){pts+=tries===0?1:.7;beep(true);$('syRes').innerHTML=`${marksHtml(m)}<br>✅ Super!`;say('Great!');next(1500)}
        else{tries++;beep(false);$('syRes').innerHTML=`${marksHtml(m)}<br>🔁 Try again!${tries>=2?' (or Skip ➡)':''}`}
      }});
    };
  };draw();
}
/* ---- 4. Read a story ---- */
function actRead(){
  const u=curU(),st=u.st,my=++tok;
  const dict={};u.w.forEach(w=>{dict[w[0].toLowerCase()]=w[1]});
  const body=st.x.map((s,si)=>`<div class="sent2" id="ss${si}"><button class="sp" data-si="${si}">🔊</button><span>${s.split(' ').map((w,wi)=>`<span class="wd" data-w="${esc(w)}" id="w${si}_${wi}">${esc(w)}</span>`).join(' ')}</span>${SR?`<button class="sp" data-mi="${si}" style="background:#ffe1e5">🎤</button>`:''}</div>`).join('');
  $('app').innerHTML=backBar('showUnit()',u.t+' · Story')+`<div class="card"><div class="center"><div style="font-size:50px">${u.e}</div><div class="word" style="font-size:30px">${esc(st.t)}</div>${R.set.ar?`<div class="ar">${st.ar}</div>`:''}</div>
   <div class="row"><button class="btn" id="rdAll">▶ Read to me</button><button class="btn alt" id="rdStop">⏹</button></div><div id="rdBody">${body}</div><div id="rdTip" class="mut center" style="min-height:22px">Tap any word to hear it 👆</div>
   <div class="row"><button class="btn" id="rdQ" style="--c:#34c47a">Questions ➡</button></div></div>`;
  const clearHl=()=>document.querySelectorAll('.wd.on').forEach(x=>x.classList.remove('on'));
  const hl=(si,k)=>{clearHl();const e=$('w'+si+'_'+k);if(e)e.classList.add('on')};
  function readSent(si,onlySay){
    return new Promise(res=>{
      document.querySelectorAll('.sent2').forEach(x=>x.classList.remove('cur'));$('ss'+si).classList.add('cur');
      const text=st.x[si],words=text.split(' '),starts=[];let pos=0;words.forEach(w=>{starts.push(pos);pos+=w.length+1});
      const u2=utter(text);let timers=[],gotB=false,done=false;
      const fin=()=>{if(done)return;done=true;timers.forEach(clearTimeout);clearHl();res()};
      u2.onboundary=e=>{if(e.name&&e.name!=='word')return;gotB=true;timers.forEach(clearTimeout);let k=0;starts.forEach((s,j)=>{if(e.charIndex>=s)k=j});hl(si,k)};
      const per=Math.max(260,60000/(135*R.set.rate));
      words.forEach((w,k)=>timers.push(setTimeout(()=>{if(!gotB)hl(si,k)},k*per+150)));
      u2.onend=fin;u2.onerror=fin;setTimeout(fin,text.length*150+4000);
      try{speechSynthesis.cancel();speechSynthesis.speak(u2)}catch(e){fin()}
    });
  }
  $('rdAll').onclick=async()=>{stopAllSpeechOnly();const t=++tok;for(let si=0;si<st.x.length;si++){if(tok!==t)return;await readSent(si)}document.querySelectorAll('.sent2').forEach(x=>x.classList.remove('cur'))};
  function stopAllSpeechOnly(){try{speechSynthesis.cancel()}catch(e){}tok++}
  $('rdStop').onclick=()=>{stopAllSpeechOnly();clearHl();document.querySelectorAll('.sent2').forEach(x=>x.classList.remove('cur'))};
  document.querySelectorAll('#rdBody [data-si]').forEach(b=>b.onclick=()=>{stopAllSpeechOnly();readSent(+b.dataset.si)});
  document.querySelectorAll('#rdBody .wd').forEach(w=>w.onclick=()=>{
    const clean=w.dataset.w.replace(/[^A-Za-z']/g,'');say(clean,.7);
    const lc=clean.toLowerCase(),ar=dict[lc]||dict[lc.replace(/s$/,'')];
    $('rdTip').innerHTML=`🔊 <b>${esc(clean)}</b>${ar&&R.set.ar?` = ${ar}`:''}`;
  });
  document.querySelectorAll('#rdBody [data-mi]').forEach(b=>b.onclick=()=>{
    if(curRec){curRec.stop();return}
    const si=+b.dataset.mi;try{speechSynthesis.cancel()}catch(e){}b.textContent='⏹';
    curRec=listen({max:9000,done:(f,alts)=>{curRec=null;b.textContent='🎤';if(tok!==my&&!$('ss'+si))return;
      const row=$('ss'+si);if(!row)return;if(!f){$('rdTip').textContent="I didn't hear you. Try again! 🎤";return}
      const m=bestMatch(st.x[si],f,alts);row.classList.remove('good','bad');row.classList.add(m.pct>=60?'good':'bad');beep(m.pct>=60);
      $('rdTip').innerHTML=m.pct>=60?'✅ Great reading!':'🔁 Try again — '+marksHtml(m);}});
  });
  $('rdQ').onclick=()=>{
    stopAllSpeechOnly();
    const qs=st.q.map(q=>{const o=shuffle(q[1].map((t,k)=>({t,ok:k===q[2]})));return{head:`<div class="sent">${esc(q[0])}</div><div class="row"><button class="btn alt sm" id="qSay">🔊</button></div>`,o:o.map(x=>esc(x.t)),a:o.findIndex(x=>x.ok),say:q[0]}});
    runMC(qs,{key:ukey('read'),again:'actRead()',back:'showUnit()',title:st.t+' · Questions'});
  };
}
/* ---- 5. Build a sentence ---- */
function actBuild(){
  const u=curU(),items=shuffle(u.s).slice(0,4);let i=0,pts=0;const my=++tok;
  const draw=()=>{
    if(i>=items.length)return finish(ukey('build'),pts/items.length,{again:'actBuild()',back:'showUnit()'});
    const[en,ar]=items[i],words=en.split(' ');let bank,ans=[],tr=0;
    const mk=()=>{let b=shuffle(words.map((w,k)=>({w,k})));for(let n=0;n<6&&b.map(t=>t.w).join(' ')===en;n++)b=shuffle(b);return b};
    bank=mk();
    $('app').innerHTML=backBar('showUnit()',u.t+' · Build')+`<div class="card center"><div class="mut">${i+1}/${items.length} · Put the words in order</div><div class="row"><button class="btn alt" id="bnHear">🔊 Listen</button></div>${R.set.ar?`<div class="ar">${ar}</div>`:''}<div id="bnAns" class="slotsA"></div><div id="bnBank" class="row"></div><div class="row"><button class="btn" id="bnCheck" style="--c:#34c47a">Check ✅</button><button class="btn alt" id="bnClr">↩ Clear</button></div><div id="bnMsg" class="mut" style="margin-top:8px;min-height:22px"></div></div>`;
    setTimeout(()=>{if(tok===my)say(en)},250);
    const paint=()=>{
      $('bnAns').innerHTML=ans.length?ans.map((t,j)=>`<button class="tile" data-j="${j}">${esc(t.w)}</button>`).join(''):'<span class="mut">Tap the words in order…</span>';
      $('bnBank').innerHTML=bank.map((t,j)=>`<button class="tile" data-b="${j}">${esc(t.w)}</button>`).join('');
      document.querySelectorAll('#bnAns [data-j]').forEach(b=>b.onclick=()=>{bank.push(ans.splice(+b.dataset.j,1)[0]);paint()});
      document.querySelectorAll('#bnBank [data-b]').forEach(b=>b.onclick=()=>{const t=bank.splice(+b.dataset.b,1)[0];say(t.w.replace(/[^A-Za-z']/g,''),.8);ans.push(t);paint()});
    };paint();
    $('bnHear').onclick=()=>say(en);
    $('bnClr').onclick=()=>{bank=bank.concat(ans);ans=[];paint()};
    $('bnCheck').onclick=()=>{
      if(ans.length<words.length){$('bnMsg').textContent='Use all the words 😊';return}
      if(ans.map(t=>t.w).join(' ')===en){pts+=tr===0?1:tr===1?.6:.3;beep(true);$('bnMsg').innerHTML='<span class="ok">✅ Perfect!</span>';say(en);setTimeout(()=>{if(tok===my){i++;draw()}},2200)}
      else{tr++;beep(false);$('bnMsg').innerHTML='<span class="no">Try again! 💪</span>';const a=$('bnAns');a.style.animation='shake .35s';setTimeout(()=>a.style.animation='',400)}
    };
  };draw();
}

const poolOf=n=>LEVELS[n-1].units.flatMap(u=>u.w);
function gMemory(){
  stopAll();const my=tok;let ws=shuffle(poolOf(gLv)).slice(0,6);
  const cards=shuffle(ws.flatMap((w,k)=>[{k,t:'e',h:w[2]},{k,t:'w',h:w[0]}]));
  let open=[],matched=0,moves=0,lock=false;
  $('app').innerHTML=backBar("go('games')",'🃏 Memory Match')+`<div class="card center"><div class="mut">Match the picture with the word · Moves: <b id="mvN">0</b></div><div class="mem" id="memG"></div></div>`;
  const paint=()=>{$('memG').innerHTML=cards.map((c,i)=>`<button class="mc ${c.f?'up':''} ${c.m?'m':''} ${c.t==='w'&&(c.f||c.m)&&c.h.length>8?'sw':''}" data-i="${i}">${c.f||c.m?esc(c.h):'❓'}</button>`).join('');
    document.querySelectorAll('.mc').forEach(b=>b.onclick=()=>{
      const c=cards[+b.dataset.i];if(lock||c.f||c.m)return;c.f=true;open.push(c);if(c.t==='w')say(c.h,.8);paint();
      if(open.length===2){moves++;$('mvN').textContent=moves;lock=true;const[a,b2]=open;
        if(a.k===b2.k&&a.t!==b2.t){setTimeout(()=>{a.m=b2.m=true;a.f=b2.f=false;open=[];lock=false;matched++;beep(true);paint();
          if(matched===6){const s=moves<=8?3:moves<=12?2:1;setTimeout(()=>finish('game:mem'+gLv,s===3?1:s===2?.7:.4,{again:'gMemory()',back:"go('games')"}),700)}},600)}
        else setTimeout(()=>{if(tok!==my)return;a.f=b2.f=false;open=[];lock=false;beep(false);paint()},1000)}
    })};paint();
}
function gBee(){
  stopAll();const my=tok;
  const ws=shuffle(poolOf(gLv).filter(w=>/^[a-z]{3,8}$/i.test(w[0]))).slice(0,5);
  if(ws.length<3){toast('Pick another level 🙂');return}
  let i=0,pts=0;
  const draw=()=>{
    if(i>=ws.length)return finish('game:bee'+gLv,pts/ws.length,{again:'gBee()',back:"go('games')"});
    const w=ws[i],word=w[0].toLowerCase();let bank=shuffle(word.split('').map((c,k)=>({c,k}))),ans=[],miss=0,lockB=false;
    $('app').innerHTML=backBar("go('games')",'🐝 Spelling Bee')+`<div class="card center"><div class="mut">${i+1}/${ws.length} · Spell the word</div><div class="emo">${w[2]}</div><div class="row"><button class="btn alt" id="beeSay">🔊 Listen</button></div>${R.set.ar?`<div class="ar">${w[1]}</div>`:''}<div id="beeAns" class="slotsA"></div><div id="beeBank" class="row"></div><div class="row"><button class="btn alt sm" id="beeUndo">↩ Undo</button></div></div>`;
    setTimeout(()=>{if(tok===my)say(word)},250);
    const paint=()=>{
      $('beeAns').innerHTML=word.split('').map((_,j)=>`<span class="tile" style="min-width:44px;text-align:center">${ans[j]?ans[j].c.toUpperCase():'_'}</span>`).join('');
      $('beeBank').innerHTML=bank.map((t,j)=>`<button class="tile" data-b="${j}">${t.c.toUpperCase()}</button>`).join('');
      document.querySelectorAll('#beeBank [data-b]').forEach(b=>b.onclick=()=>{
        if(lockB)return;const t=bank.splice(+b.dataset.b,1)[0];ans.push(t);say(t.c,.8);paint();
        if(ans.length===word.length){lockB=true;
          if(ans.map(x=>x.c).join('')===word){pts+=miss===0?1:.5;beep(true);say(word);setTimeout(()=>{if(tok===my){i++;draw()}},1400)}
          else{miss++;beep(false);setTimeout(()=>{bank=shuffle(bank.concat(ans));ans=[];lockB=false;paint()},800)}}
      });
    };paint();
    $('beeSay').onclick=()=>say(word);
    $('beeUndo').onclick=()=>{if(lockB||!ans.length)return;bank.push(ans.pop());paint()};
  };draw();
}

      clearInterval(tick);curRec=null;if(tok!==my)return;const secs=Math.max(1,(Date.now()-t0)/1000);

(async function init(){
  Object.values(R.profiles).forEach(fixP);
  const recovery=/type=recovery/.test(location.hash);
  sbInit();
  if(_sb&&!recovery){
    try{const r=await withTimeout(_sb.auth.getSession(),7000);const ses=r.data&&r.data.session;
      if(ses){_user=ses.user;try{await pullAndMerge()}catch(e){console.error(e);toast('⚠️ مفيش اتصال، شغال بالنسخة اللي على الجهاز')}}}
    catch(e){console.error(e)}
  }
  if(recovery){showAccount('reset');return}
  const ids=Object.keys(R.profiles);
  if(!ids.length){if(_user)showSetup(true);else showAccount('first');return}
  if(!R.profiles[R.cur])R.cur=ids[0];
  P=R.profiles[R.cur];renderHdr();go('learn');
  if(!window.speechSynthesis)toast('⚠️ المتصفح مش بيدعم الصوت');
})();
</script>
</body>
</html>
